name: Deploy do frontend no GitHub Pages

# O Pages serve apenas arquivos estáticos, então este workflow publica só o frontend.
# A API (Node + PostgreSQL) precisa ser hospedada à parte e sua URL informada na
# variável VITE_API_URL — veja a seção "Publicar" do README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já estiver em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # O site fica em https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Defina em Settings → Secrets and variables → Actions → Variables.
          # Sem isso o frontend sobe sem API e nenhuma tela carrega dados.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Avisar se a API não foi configurada
        if: vars.VITE_API_URL == ''
        run: |
          echo "::warning title=API não configurada::A variável VITE_API_URL está vazia."
          echo "O site vai subir, mas login e dados não vão funcionar sem uma API publicada."
          echo "Defina em Settings → Secrets and variables → Actions → Variables."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
