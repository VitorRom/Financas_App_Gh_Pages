name: Deploy do frontend no GitHub Pages

# O Pages serve apenas arquivos estáticos, então este workflow publica só o frontend.
# A API (Node + PostgreSQL) precisa ser hospedada à parte e sua URL informada na
# variável VITE_API_URL — veja a seção "Publicar" do README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já estiver em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Tenta habilitar o Pages pela API. Sem isso, o primeiro deploy falha com
      # "Failed to create deployment (status: 404)" — que na verdade quer dizer
      # "Pages não está ligado neste repositório".
      - name: Habilitar o GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Aviso, não erro: se o Pages já estiver ligado, a chamada acima pode falhar
      # por permissão sem que haja problema algum. Quando realmente estiver desligado,
      # quem falha é o job de deploy, com a mensagem própria dele.
      - name: Pages não pôde ser habilitado automaticamente
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=Verifique o GitHub Pages::Se o deploy falhar, abra Settings -> Pages e selecione Source: GitHub Actions."
          echo "https://github.com/${{ github.repository }}/settings/pages"

      - uses: actions/setup-node@v4
        with:
          # Node 20 saiu de suporte nos runners do GitHub.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes do modo autônomo
        run: npm test

      - name: Build
        env:
          # O site fica em https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Sem VITE_API_URL definida, sobe em modo autônomo (dados no navegador).
          VITE_STANDALONE: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Modo da publicação
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::notice title=Modo autonomo::Publicado sem API: os dados ficam no navegador de cada pessoa."
          else
            echo "::notice title=Com API::Publicado apontando para ${{ vars.VITE_API_URL }}."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
